# 1. El nombre de tu flujo de trabajo (aparecerá en la pestaña Actions)
name: Mi Primera Acción

# 2. ¿Cuándo se debe ejecutar? (Eventos)
on:
  push:
    branches:
      - deploy # Se ejecutará solo cuando hagas push a la rama 'deploy'
  workflow_dispatch: # Permite ejecutarlo manualmente desde un botón en GitHub

# 3. ¿Qué es lo que va a hacer? (Trabajos/Jobs)
jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest # GitHub te presta una máquina virtual pequeña con Ubuntu

    steps: # Los pasos secuenciales a ejecutar en esa máquina
      - name: Traer el código de mi repositorio
        uses: actions/checkout@v3 # Acción prefabricada para descargar tu código

      - name: Imprimir un saludo
        run: echo "¡Hola! Mi proyecto se está preparando para desplegarse."