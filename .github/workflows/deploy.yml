name: Fronten funcionando 

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'

      - name: Instalar y Compilar Frontend
        run: |
          cd "front_despacho"
          npm ci
          npm run build

      - name: Desplegar en AWS EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.IP_PUBLIC }}
          username: 'ec2-user'
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          source: "front_despacho/dist/*"
          target: "/var/www/html"
          strip_components: 2

      - name: Estado de Despliegue
        run: |
          echo "Fontend levantado"